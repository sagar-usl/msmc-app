<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <div style="position:sticky;top:0;z-index:3;background:#fff;display:flex;align-items:center;gap:12px;padding:14px 16px;box-shadow:0 1px 0 rgba(11,61,145,0.08)">
    <div onClick="{{ goHome }}" style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#F5F7FA">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0B3D91" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    </div>
    <div style="font-size:16px;font-weight:700;color:#14213d">{{ t.title }}</div>
  </div>
  <div style="padding:16px;display:flex;flex-direction:column;gap:14px">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <sc-for list="{{ cats }}" as="c" hint-placeholder-count="6">
      <div style="background:#fff;border-radius:16px;padding:16px 14px;box-shadow:0 2px 12px rgba(11,61,145,0.08);display:flex;flex-direction:column;gap:10px;cursor:pointer" style-hover="box-shadow:0 6px 18px rgba(11,61,145,0.16)">
        <div style="width:38px;height:38px;border-radius:10px;background:{{ c.tint }};display:flex;align-items:center;justify-content:center" dangerouslySetInnerHTML="{{ c.iconHtml }}"></div>
        <div style="font-size:12.5px;font-weight:700;color:#14213d;line-height:1.3">{{ c.title }}</div>
        <div style="font-size:10.5px;color:#8a8f98">{{ c.count }} {{ t.schemesWord }}</div>
      </div>
    </sc-for>
    <div style="height:8px;grid-column:1/-1"></div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const ICON_GRANT = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>';
const ICON_JOB = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>';
const ICON_HOME = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>';
const ICON_HEALTH = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 10-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 000-7.8z"/></svg>';
const ICON_SHIELD = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10V6l8-4z"/></svg>';
const ICON_MORE = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>';
const ICONS = [ICON_GRANT, ICON_JOB, ICON_HOME, ICON_HEALTH, ICON_SHIELD, ICON_MORE];
const TINTS = ['#0B3D91', '#FF9933', '#2E7D32', '#c0392b', '#6a4c93', '#5f6368'];

const T = {
  en: {
    title: 'Minority Welfare Schemes', schemesWord: 'schemes',
    titles: ['Financial Assistance', 'Self Employment Schemes', 'Housing Schemes', 'Health Schemes', 'Social Security & Pension', 'Other Schemes'],
    counts: [6, 4, 3, 5, 3, 8],
  },
  mr: {
    title: 'अल्पसंख्याक कल्याण योजना', schemesWord: 'योजना',
    titles: ['आर्थिक सहाय्य', 'स्वयंरोजगार योजना', 'गृहनिर्माण योजना', 'आरोग्य योजना', 'सामाजिक सुरक्षा व निवृत्तीवेतन', 'इतर योजना'],
    counts: [6, 4, 3, 5, 3, 8],
  },
};

class Component extends DCLogic {
  renderVals() {
    const t = T[this.props.lang === 'mr' ? 'mr' : 'en'];
    const cats = t.titles.map((title, i) => ({ title, count: t.counts[i], tint: TINTS[i], iconHtml: { __html: ICONS[i] } }));
    return { l: this.props.l || {}, t, goHome: () => this.props.go && this.props.go('home'), cats };
  }
}

</script>
</body>
</html>
