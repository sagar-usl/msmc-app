<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:16px 16px 4px;display:flex;flex-direction:column;gap:16px">

  <!-- CAROUSEL -->
  <div style="position:relative;width:100%;height:200px;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(11,61,145,0.15)">
    <sc-for list="{{ slides }}" as="s" hint-placeholder-count="4">
      <div style="position:absolute;inset:0;display:{{ s.display }};animation:fadeIn 0.5s ease both">
        <sc-if value="{{ s.placeholder }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;inset:0;background:{{ s.tint }};background-image:repeating-linear-gradient(135deg,rgba(255,255,255,0.09) 0 3px,transparent 3px 22px)"></div>
          <div style="position:absolute;top:14px;left:16px;color:rgba(255,255,255,0.55);font-family:ui-monospace,Menlo,monospace;font-size:9.5px;letter-spacing:0.08em">[ photo: {{ s.labelEn }} ]</div>
        </sc-if>
        <sc-if value="{{ s.img }}" hint-placeholder-val="{{ false }}">
          <img src="{{ s.img }}" alt="{{ s.title }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />
        </sc-if>
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.55) 100%)"></div>
        <div style="position:absolute;right:10px;bottom:10px;left:60px;background:rgba(255,255,255,0.16);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.25);border-radius:12px;padding:9px 12px">
          <div style="color:#fff;font-size:13.5px;font-weight:700;line-height:1.25">{{ s.title }}</div>
          <div style="color:rgba(255,255,255,0.85);font-size:10.5px;margin-top:2px">{{ s.desc }}</div>
        </div>
      </div>
    </sc-for>
    <div style="position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px;z-index:2">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="4">
        <div onClick="{{ d.onClick }}" style="width:{{ d.dotWidth }};height:6px;border-radius:3px;background:{{ d.dotColor }};cursor:pointer;transition:width 0.25s ease"></div>
      </sc-for>
    </div>
  </div>

  <!-- CHAIRMAN CARD -->
  <div style="background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 14px rgba(11,61,145,0.08);display:flex;flex-direction:column;gap:12px">
    <div style="font-size:11px;font-weight:700;color:#FF9933;letter-spacing:0.06em;text-transform:uppercase">{{ l.chairmanLabel }}</div>
    <div style="display:flex;gap:14px;align-items:flex-start">
      <img src="chairman-avatar.png" alt="Chairman" style="width:56px;height:56px;border-radius:50%;flex-shrink:0;object-fit:cover;box-shadow:0 4px 10px rgba(11,61,145,0.3);border:2px solid #FF9933" />
      <div style="min-width:0">
        <div style="font-size:14.5px;font-weight:700;color:#14213d;font-family:'Noto Sans Devanagari','Roboto',sans-serif">{{ l.chairmanName }}</div>
        <div style="font-size:11px;color:#5f6368;margin-top:1px">{{ l.chairmanTitle }}</div>
      </div>
    </div>
    <div style="font-size:12.5px;line-height:1.6;color:#3c4043;font-style:italic;border-left:3px solid #FF9933;padding-left:12px;font-family:'Noto Sans Devanagari','Roboto',sans-serif">{{ l.chairmanMsg }}</div>
  </div>

  <!-- ABOUT CARD -->
  <div style="background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 14px rgba(11,61,145,0.08);display:flex;flex-direction:column;gap:10px">
    <div style="font-size:11px;font-weight:700;color:#0B3D91;letter-spacing:0.06em;text-transform:uppercase">{{ l.aboutLabel }}</div>
    <div style="font-size:12.5px;line-height:1.65;color:#3c4043;font-family:'Noto Sans Devanagari','Roboto',sans-serif">{{ l.aboutText }}</div>
    <div style="display:flex;justify-content:flex-end;margin-top:2px">
      <div onClick="{{ goAbout }}" style="border:1.5px solid #0B3D91;color:#0B3D91;font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:100px;cursor:pointer;display:flex;align-items:center;gap:6px" style-hover="background:#0B3D91;color:#fff">
        {{ l.knowMore }}
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div style="background:#0B3D91;border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;margin-top:2px">
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <div style="background:rgba(255,255,255,0.1);border-radius:8px;padding:6px 10px;color:#fff;font-size:9.5px;font-weight:600">DIGITAL INDIA</div>
      <div style="background:rgba(255,255,255,0.1);border-radius:8px;padding:6px 10px;color:#fff;font-size:9.5px;font-weight:600">NIC</div>
      <div style="background:rgba(255,255,255,0.1);border-radius:8px;padding:6px 10px;color:#fff;font-size:9.5px;font-weight:600">MYGOV</div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:4px 14px">
      <sc-for list="{{ l.footerLinks }}" as="link" hint-placeholder-count="4">
        <div style="color:rgba(255,255,255,0.75);font-size:11px;cursor:pointer" style-hover="color:#fff;text-decoration:underline">{{ link }}</div>
      </sc-for>
    </div>
    <div style="color:rgba(255,255,255,0.45);font-size:10px;line-height:1.5">{{ l.footerCopyright }}</div>
  </div>

  <div style="height:8px"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const isMr = this.props.lang === 'mr';
    const dots = (this.props.dots || []).map(d => ({
      ...d,
      dotWidth: d.active ? '20px' : '6px',
      dotColor: d.active ? '#FF9933' : 'rgba(11,61,145,0.25)',
    }));
    const slides = (this.props.slides || []).map(s => ({
      ...s,
      title: isMr ? s.titleMr : s.titleEn,
      desc: isMr ? s.descMr : s.descEn,
    }));
    return {
      l: this.props.l || {},
      slides,
      dots,
      goAbout: () => this.props.go && this.props.go('about'),
    };
  }
}

</script>
</body>
</html>
